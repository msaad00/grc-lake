# Example: block merges when GRC Lake posture regresses.
# Copy into .github/workflows/ and set repository secrets:
#   GRC_LAKE_URL, GRC_LAKE_API_TOKEN (read-scoped API key)
# Reference: docs/CI_GATE.md
name: GRC Lake posture gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate GRC Lake posture
        id: gate
        uses: msaad00/grc-lake/.github/actions/posture-gate@v0.3.0
        with:
          grc-lake-url: ${{ secrets.GRC_LAKE_URL }}
          api-token: ${{ secrets.GRC_LAKE_API_TOKEN }}
          correlation-id: pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}
          min-score: "70"
          max-critical-violations: "0"
          max-open-violations: "25"
          max-failing-control-tests: "0"
