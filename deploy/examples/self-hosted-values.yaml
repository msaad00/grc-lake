# Authenticated single-replica deployment. Create grc-lake-server first and
# configure human OIDC/SAML login using docs/SERVER_AUTH.md before sharing a URL.
# Inherit image.tag from the versioned chart rather than maintaining another pin.
security:
  requireAuthentication: true
replicaCount: 1
lake:
  readOnly: false
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
scheduler:
  enabled: true
env:
  - name: GRC_LAKE_ENV
    value: production
  - name: GRC_LAKE_COOKIE_SIGNING_KEY
    valueFrom:
      secretKeyRef:
        name: grc-lake-server
        key: GRC_LAKE_COOKIE_SIGNING_KEY
