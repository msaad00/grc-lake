{{- range .Values.env }}
{{- if eq .name "TRUSTOPS_ALLOW_INSECURE_NO_AUTH" }}
{{- fail "configure no-auth through security.allowInsecureNoAuth and its acknowledgement, not env[]" }}
{{- end }}
{{- end }}
{{- if and .Values.security.allowInsecureNoAuth (ne .Values.security.allowInsecureOverride "acknowledged") }}
{{- fail "security.allowInsecureNoAuth requires security.allowInsecureOverride=acknowledged for hosted deployments" }}
{{- end }}
{{- if and .Values.security.requireAuthentication (not (eq (include "trustops.authConfigured" .) "true")) }}
{{- fail "security.requireAuthentication: set a non-empty TRUSTOPS_COOKIE_SIGNING_KEY signing secret or required secretKeyRef in env[]; OIDC also needs TRUSTOPS_SESSION_SECRET, or use allowInsecureNoAuth with allowInsecureOverride=acknowledged" }}
{{- end }}
{{- if and .Values.ingress.enabled (not (eq (include "trustops.authConfigured" .) "true")) }}
{{- fail "ingress.enabled requires authentication signing secret TRUSTOPS_COOKIE_SIGNING_KEY in env[]; OIDC also needs TRUSTOPS_SESSION_SECRET or documented allowInsecureNoAuth override" }}
{{- end }}
{{- if .Values.lake.readOnly }}
{{- fail "read-only lake is unsupported: startup, migrations, and request auditing need writable state — see docs/runbooks/HA_READ_REPLICAS.md" }}
{{- end }}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1 for every lake access mode; distributed writers are unsupported" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trustops.fullname" . }}
  labels:
    {{- include "trustops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # RollingUpdate can overlap writers even with replicaCount=1.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "trustops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trustops.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "trustops.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: trustops
          image: {{ include "trustops.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: TRUSTOPS_LAKE
              value: {{ .Values.lake.mountPath | quote }}
            - name: TRUSTOPS_API_RATE_LIMIT_RPS
              value: {{ .Values.rateLimit.rps | quote }}
            - name: TRUSTOPS_API_RATE_LIMIT_BURST
              value: {{ .Values.rateLimit.burst | quote }}
            {{- if .Values.rateLimit.redisUrl }}
            - name: TRUSTOPS_API_RATE_LIMIT_REDIS_URL
              value: {{ .Values.rateLimit.redisUrl | quote }}
            {{- end }}
            {{- if .Values.defaultTrustRole }}
            - name: TRUSTOPS_DEFAULT_ROLE
              value: {{ .Values.defaultTrustRole | quote }}
            {{- end }}
            {{- if .Values.security.allowInsecureNoAuth }}
            - name: TRUSTOPS_ALLOW_INSECURE_NO_AUTH
              value: "1"
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: lake
              mountPath: {{ .Values.lake.mountPath }}
              readOnly: {{ .Values.lake.readOnly }}
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/trustops
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: lake
          {{- if .Values.lake.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "trustops.fullname" . }}-lake
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
