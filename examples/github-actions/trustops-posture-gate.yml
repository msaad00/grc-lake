# Example: block merges when TrustOps posture regresses.
# Copy into .github/workflows/ and set repository secrets:
#   TRUSTOPS_URL, TRUSTOPS_API_TOKEN (read-scoped API key)
# Reference: docs/CI_GATE.md
name: TrustOps posture gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate TrustOps posture
        id: gate
        uses: msaad00/trustops-security-data-lake/.github/actions/posture-gate@v0.2.20
        with:
          trustops-url: ${{ secrets.TRUSTOPS_URL }}
          api-token: ${{ secrets.TRUSTOPS_API_TOKEN }}
          correlation-id: pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}
          min-score: "70"
          max-critical-violations: "0"
          max-open-violations: "25"
          max-failing-control-tests: "0"
