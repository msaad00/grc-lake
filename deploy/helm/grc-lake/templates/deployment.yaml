{{- $http := not (and .Values.distributed.enabled (eq .Values.distributed.role "worker")) }}
{{- $distributed := .Values.distributed.enabled }}
{{- range .Values.env }}
{{- if and $distributed (has .name (list "GRC_LAKE_DEPLOYMENT_MODE" "TRUSTOPS_DEPLOYMENT_MODE" "GRC_LAKE_CLUSTER_ID" "GRC_LAKE_OBJECT_BUCKET" "GRC_LAKE_OBJECT_ENDPOINT" "GRC_LAKE_VIRTUAL_SHARDS" "GRC_LAKE_REPLICA_ROLE" "GRC_LAKE_DATABASE_URL" "TRUSTOPS_DATABASE_URL")) }}
{{- fail "configure cluster identity and database through distributed values, not env[]" }}
{{- end }}
{{- if or (eq .name "GRC_LAKE_ALLOW_INSECURE_NO_AUTH") (eq .name "TRUSTOPS_ALLOW_INSECURE_NO_AUTH") }}
{{- fail "configure no-auth through security.allowInsecureNoAuth and its acknowledgement, not env[]" }}
{{- end }}
{{- end }}
{{- if and .Values.security.allowInsecureNoAuth (ne .Values.security.allowInsecureOverride "acknowledged") }}
{{- fail "security.allowInsecureNoAuth requires security.allowInsecureOverride=acknowledged for hosted deployments" }}
{{- end }}
{{- if and .Values.security.requireAuthentication (not (eq (include "grc-lake.authConfigured" .) "true")) }}
{{- fail "security.requireAuthentication: set a non-empty GRC_LAKE_COOKIE_SIGNING_KEY signing secret or required secretKeyRef in env[]; OIDC also needs GRC_LAKE_SESSION_SECRET, or use allowInsecureNoAuth with allowInsecureOverride=acknowledged" }}
{{- end }}
{{- if and .Values.ingress.enabled (not (eq (include "grc-lake.authConfigured" .) "true")) }}
{{- fail "ingress.enabled requires authentication signing secret GRC_LAKE_COOKIE_SIGNING_KEY in env[]; OIDC also needs GRC_LAKE_SESSION_SECRET or documented allowInsecureNoAuth override" }}
{{- end }}
{{- if .Values.lake.readOnly }}
{{- fail "read-only lake is unsupported: startup, migrations, and request auditing need writable state — see docs/runbooks/HA_READ_REPLICAS.md" }}
{{- end }}
{{- if and (not .Values.distributed.enabled) (ne (int .Values.replicaCount) 1) }}
{{- fail "replicaCount must be 1 in local mode; configure distributed PostgreSQL/S3 mode for multiple replicas" }}
{{- end }}
{{- if and .Values.distributed.enabled (not (eq (include "grc-lake.authConfigured" .) "true")) }}
{{- fail "distributed mode requires authentication signing configuration" }}
{{- end }}
{{- if and .Values.distributed.enabled .Values.security.allowInsecureNoAuth }}
{{- fail "distributed mode requires authentication" }}
{{- end }}
{{- if and .Values.distributed.enabled (not (has .Values.distributed.role (list "api" "reader" "worker"))) }}
{{- fail "distributed.role must be api, reader or worker" }}
{{- end }}
{{- if and .Values.distributed.enabled (eq .Values.distributed.role "worker") .Values.ingress.enabled }}
{{- fail "worker deployments do not serve HTTP ingress" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grc-lake.fullname" . }}
  labels:
    {{- include "grc-lake.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # RollingUpdate can overlap writers even with replicaCount=1.
  strategy:
    type: {{ ternary "RollingUpdate" "Recreate" .Values.distributed.enabled }}
  selector:
    matchLabels:
      {{- include "grc-lake.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grc-lake.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "grc-lake.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: trustops
          image: {{ include "grc-lake.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if and .Values.distributed.enabled (eq .Values.distributed.role "worker") }}
          args:
            - grc-lake
            - cluster
            - worker
            - --lake
            - {{ .Values.lake.mountPath | quote }}
            - --concurrency
            - {{ .Values.distributed.workerConcurrency | quote }}
            - --shards
            - {{ .Values.distributed.workerShards | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            {{- include "grc-lake.distributedEnv" . | nindent 12 }}
            - name: GRC_LAKE_LAKE
              value: {{ .Values.lake.mountPath | quote }}
            - name: GRC_LAKE_API_RATE_LIMIT_RPS
              value: {{ .Values.rateLimit.rps | quote }}
            - name: GRC_LAKE_API_RATE_LIMIT_BURST
              value: {{ .Values.rateLimit.burst | quote }}
            {{- if .Values.rateLimit.redisUrl }}
            - name: GRC_LAKE_API_RATE_LIMIT_REDIS_URL
              value: {{ .Values.rateLimit.redisUrl | quote }}
            {{- end }}
            {{- if .Values.defaultTrustRole }}
            - name: GRC_LAKE_DEFAULT_ROLE
              value: {{ .Values.defaultTrustRole | quote }}
            {{- end }}
            {{- if .Values.security.allowInsecureNoAuth }}
            - name: GRC_LAKE_ALLOW_INSECURE_NO_AUTH
              value: "1"
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if and .Values.probes.startup.enabled $http }}
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if and .Values.probes.liveness.enabled $http }}
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- end }}
          {{- if and .Values.probes.readiness.enabled $http }}
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: lake
              mountPath: {{ .Values.lake.mountPath }}
              readOnly: {{ .Values.lake.readOnly }}
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/trustops
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: lake
          {{- if .Values.distributed.enabled }}
          emptyDir:
            sizeLimit: {{ .Values.distributed.scratchSize }}
          {{- else if .Values.lake.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "grc-lake.fullname" . }}-lake
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
