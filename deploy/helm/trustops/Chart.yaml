apiVersion: v2
name: trustops
description: |
  TrustOps Security Data Lake — continuous compliance assessment workbench.
  Ships the API + React workbench in one OCI image with a persistent local
  JSONL evidence lake and SQLite mart. Includes optional DuckDB, Parquet, and
  Iceberg REST export commands. Catalogs and remote storage require separate provisioning;
  egress depends on configured connectors and sinks.
type: application
version: 0.2.17
appVersion: "0.2.17"
kubeVersion: ">=1.27.0"
home: https://github.com/msaad00/trustops-security-data-lake
sources:
  - https://github.com/msaad00/trustops-security-data-lake
maintainers:
  - name: TrustOps maintainers
    url: https://github.com/msaad00/trustops-security-data-lake
keywords:
  - compliance
  - soc2
  - iso27001
  - hipaa
  - pci
  - gdpr
  - eu-ai-act
  - iso42001
  - security
  - data-lake
  - workbench
