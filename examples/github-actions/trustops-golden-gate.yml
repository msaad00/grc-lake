# Try the TrustOps posture gate with no deployment of your own.
#
# Copy into .github/workflows/ of any repository. The job installs TrustOps on
# the runner, loads the bundled "golden" sample company, serves it on the
# runner's loopback interface, and runs the gate twice:
#
#   1. a ratchet gate at the sample's current numbers, which passes and fails
#      only if posture gets worse;
#   2. a strict gate, which is expected to fail on the sample data. The last
#      step asserts that it did, so this workflow proves the gate blocks.
#
# Against a real deployment, use trustops-posture-gate.yml instead.
# Reference: docs/CI_GATE.md
name: TrustOps posture gate (sample data)

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRUSTOPS_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install TrustOps
        run: pip install "trustops-security-data-lake[server]==0.2.20"

      - name: Load the sample company
        run: security-lakehouse fixtures load --company golden --out "$RUNNER_TEMP/lake" --rebase-times

      # No authentication, bound to the runner's loopback only, sample data only.
      - name: Serve TrustOps on the runner
        run: |
          nohup security-lakehouse serve --server --allow-insecure-no-auth \
            --lake "$RUNNER_TEMP/lake" --host 127.0.0.1 --port 8787 \
            > "$RUNNER_TEMP/trustops.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS "$TRUSTOPS_URL/api/healthz" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/trustops.log"
          exit 1

      - name: Ratchet gate (sample baseline)
        id: baseline
        uses: msaad00/trustops-security-data-lake/.github/actions/posture-gate@v0.2.20
        with:
          trustops-url: ${{ env.TRUSTOPS_URL }}
          min-score: "5"
          max-critical-violations: "4"
          max-open-violations: "19"
          max-failing-control-tests: "19"

      - name: Strict gate (expected to fail on the sample)
        id: strict
        continue-on-error: true
        uses: msaad00/trustops-security-data-lake/.github/actions/posture-gate@v0.2.20
        with:
          trustops-url: ${{ env.TRUSTOPS_URL }}
          min-score: "70"
          max-critical-violations: "0"
          max-failing-control-tests: "0"
          allowed-failing-controls: "SOC2-CC6.1"

      - name: Assert the strict gate blocked
        env:
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
          SCORE: ${{ steps.baseline.outputs.posture_score }}
          STATE: ${{ steps.baseline.outputs.posture_state }}
          CRITICAL: ${{ steps.baseline.outputs.critical_violation_count }}
          FAILING: ${{ steps.baseline.outputs.failed_control_test_count }}
        run: |
          {
            echo "### TrustOps posture gate (sample data)"
            echo "- score: ${SCORE} (${STATE})"
            echo "- critical violations: ${CRITICAL}"
            echo "- failing control tests: ${FAILING}"
            echo "- strict gate: ${STRICT_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "${STRICT_OUTCOME}" = "failure"
