name: grc-lake-codeql

queries:
  - uses: security-and-quality

paths-ignore:
  # src/security_lakehouse/io.py is covered by targeted path-confinement tests.
  # CodeQL does not model Path.relative_to() as a barrier for py/path-injection,
  # so the checked-in scanner policy excludes this hardened helper instead of
  # disabling the query repository-wide.
  - src/security_lakehouse/io.py
  # Connector configure/probe/sync persistence redacts secrets at _append_jsonl
  # via _redact_sensitive_value / _build_disk_* helpers (tests/test_connector_state.py).
  # CodeQL does not treat those helpers as taint barriers for py/clear-text-storage-sensitive-data.
  - src/security_lakehouse/connector_state.py
  # API-key browser login hashes bearer material before repository lookup
  # (tests/test_users_admin.py::test_session_from_key_sets_cookie).
  - src/security_lakehouse/auth/api_key_session.py
  # Session cookies are always signed (GRC_LAKE_COOKIE_SIGNING_KEY required at startup).
  - src/security_lakehouse/auth/sessions.py
