<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">GRC Lake continuous assessment architecture</title>
  <desc id="desc">Read-only evidence sources flow through ingestion into a customer-owned evidence lake, deterministic GRC Lake assessment, and console, API, workflows, and trust shares.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .muted { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .tiny { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; font-size: 11px; }
      .pill { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; }
      .title { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#f1f5f9"/>
  <rect x="40" y="28" width="1200" height="764" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>

  <text x="72" y="72" class="label" font-size="26" font-weight="800">GRC Lake Continuous Assessment Architecture</text>
  <text x="72" y="100" class="muted" font-size="14">Read-only ingest → customer lake → deterministic controls → shared surfaces</text>

  <!-- Step rail -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800">
    <rect x="72" y="122" width="148" height="26" rx="13" fill="#e0f2fe"/>
    <text x="88" y="139" fill="#0369a1">1 · SOURCE READS</text>
    <rect x="268" y="122" width="118" height="26" rx="13" fill="#eef2ff"/>
    <text x="284" y="139" fill="#4338ca">2 · INGEST</text>
    <rect x="434" y="122" width="148" height="26" rx="13" fill="#ecfeff"/>
    <text x="450" y="139" fill="#0f766e">3 · MATERIALIZE</text>
    <rect x="660" y="122" width="124" height="26" rx="13" fill="#fef3c7"/>
    <text x="676" y="139" fill="#92400e">4 · ASSESS</text>
    <rect x="876" y="122" width="168" height="26" rx="13" fill="#f5f3ff"/>
    <text x="892" y="139" fill="#6d28d9">5 · OPERATE + SHARE</text>
  </g>

  <!-- Sources -->
  <g>
    <rect x="72" y="168" width="196" height="380" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="92" y="200" class="label" font-size="17" font-weight="800">Evidence sources</text>
    <text x="92" y="222" class="muted" font-size="12">Read-only, least privilege</text>

