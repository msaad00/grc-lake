# GRC Lake with Docker Compose.
#
# Local demo (default):
#
#   docker compose up
#   open http://127.0.0.1:8787/console/dashboard/
#
#   Loads the bundled "golden" sample company on first start into the
#   `grc-lake-demo-lake` volume and serves it with AUTHENTICATION DISABLED.
#   The port is published on 127.0.0.1 only. Never expose this service to a
#   network, and never load real evidence into it.
#   Reset the demo: docker compose down -v
#
# Real use (profile "server"):
#
#   cp deploy/compose/grc-lake.env.example grc-lake.env   # fill in secrets
#   docker compose up -d grc-lake-server
#   open http://127.0.0.1:8788/
#
#   Authentication on, no demo data, secrets from grc-lake.env (gitignored),
#   its own `grc-lake-lake` volume. See docs/DEPLOYMENT.md for TLS and backups.
#
# Pin a different release with GRC_LAKE_VERSION, e.g.
#   GRC_LAKE_VERSION=<release-version> docker compose up

name: grc-lake

services:
  grc-lake:
    image: ghcr.io/msaad00/grc-lake:${GRC_LAKE_VERSION:-0.3.1}
    environment:
      # The container binds 0.0.0.0 internally, so no-auth mode must be named
      # explicitly; the host side below stays on loopback.
      GRC_LAKE_ENV: demo
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - grc-lake-demo-lake:/lake
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - sh
      - -c
      - |
        set -e
        echo "======================================================================"
        echo " GRC Lake LOCAL DEMO: NO AUTHENTICATION. Sample data only."
        echo " Published on 127.0.0.1:8787. Do not expose this port."
        echo " For real use: docker compose up -d grc-lake-server"
        echo "======================================================================"
        if [ ! -e /lake/.grc-lake-demo-seeded ] && [ ! -e /lake/.trustops-demo-seeded ]; then
          grc-lake fixtures load --company golden --out /lake --rebase-times
          touch /lake/.grc-lake-demo-seeded
        fi
        exec grc-lake serve --server --allow-insecure-no-auth --lake /lake --host 0.0.0.0 --port 8787

  grc-lake-server:
    profiles: ["server"]
    image: ghcr.io/msaad00/grc-lake:${GRC_LAKE_VERSION:-0.3.1}
    # The image's default command serves with authentication required.
    env_file:
      - grc-lake.env
    environment:
      # Refuses GRC_LAKE_ALLOW_INSECURE_NO_AUTH at startup.
      GRC_LAKE_ENV: production
    ports:
      # Loopback only: put a TLS-terminating reverse proxy in front before
      # publishing on another interface.
      - "127.0.0.1:8788:8787"
    volumes:
      - grc-lake-lake:/lake
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  grc-lake-demo-lake:
    name: ${GRC_LAKE_DEMO_VOLUME:-trustops_trustops-demo-lake}
  grc-lake-lake:
    name: ${GRC_LAKE_VOLUME:-trustops_trustops-lake}
