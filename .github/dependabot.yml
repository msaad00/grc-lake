# Group by ecosystem and upgrade risk, not vendor: related runtime, type, and
# test packages share one lockfile and should be validated together.
# One outstanding version PR per ecosystem. Minor/patch updates form a weekly
# batch; eligible major upgrades remain individual reviews. An open major PR can
# hold the next routine batch until it is resolved.
# Security fixes use separate groups and are not delayed by the weekly schedule
# or the version-PR limit. No automatic merging is configured.

version: 2
updates:
  # Python deps (pyproject.toml + uv.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # MCP 2 removes mcp.server.fastmcp; migrate the server before widening <2.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      python-weekly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # React workbench (app/web/package.json + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/app/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "UTC"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # These known migrations need explicit work before dependency upgrades.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
    groups:
      web-weekly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions pinned versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "UTC"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      actions-weekly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # Application and fuzz-builder base images
  - package-ecosystem: "docker"
    directories: ["/", "/.clusterfuzzlite"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:45"
      timezone: "UTC"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    groups:
      containers-weekly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      containers-security:
        applies-to: security-updates
        patterns: ["*"]
