name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Dependency security regressions
        run: npm run test:dependencies
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build static export
        run: npm run build
      - name: Upload built React bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: src/security_lakehouse/web/dist
          if-no-files-found: error
          retention-days: 1

  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: web
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: src/security_lakehouse/web/dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Build and verify fresh wheel
        run: |
          uv build --wheel --out-dir dist
          python tools/verify_wheel.py dist/*.whl
      - name: Smoke isolated virtualenv and user installations outside checkout
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(realpath dist/*.whl)
          smoke=$(realpath tools/smoke_installed_package.py)
          install_root=$(mktemp -d)
          # Lock runtime dependencies and hash the wheel built by this job.
          requirements="$install_root/requirements.txt"
          uv export --frozen --no-dev --extra server --no-emit-project --output-file "$requirements"
          wheel_hash=$(sha256sum "$wheel" | cut -d ' ' -f1)
          printf '%s[server] --hash=sha256:%s\n' "$wheel" "$wheel_hash" >> "$requirements"
          python -m venv "$install_root/venv"
          uv pip install --python "$install_root/venv/bin/python" --require-hashes -r "$requirements"
          cd "$install_root"
          unset PYTHONPATH GRC_LAKE_DATA_DIR
          "$install_root/venv/bin/python" "$smoke" "$install_root/venv"
          export PYTHONUSERBASE="$install_root/user"
          python -m pip install --user --ignore-installed --require-hashes -r "$requirements"
          python "$smoke" "$install_root/user"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0" # keep in step with the Dockerfile uv image
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen --all-extras
      - name: Compile Python
        run: uv run python -m compileall -q src tests tools
      - name: Lint Python
        run: uv run ruff check src tests tools
      - name: Check Python formatting
        run: uv run ruff format --check src tests tools
      - name: Type-check Python
        run: uv run mypy
      - name: Check packaged resources match their canonical sources
        run: uv run python tools/sync_package_resources.py --check
      - name: Validate schemas and JSON artifacts
        run: uv run python tools/validate_ci_artifacts.py

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0" # keep in step with the Dockerfile uv image
          enable-cache: true
      - name: Install (frozen)
        run: uv sync --frozen --extra dev
      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        env:
          # The quality job owns Ruff; security owns the full-history secret scan.
          SKIP: ruff,ruff-format,gitleaks
        run: uv run pre-commit run --all-files

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0" # keep in step with the Dockerfile uv image
          enable-cache: true
      - name: Install (frozen)
        run: uv sync --frozen --all-extras
      - name: pip-audit (Python deps)
        # Audit resolved deps from uv.lock, skipping the local editable
        # package (not on PyPI). Fails CI on any known CVE.
        run: |
          uv export --all-extras --no-emit-project --format requirements-txt --no-hashes > /tmp/reqs.txt
          uv run pip-audit --strict -r /tmp/reqs.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/web/package-lock.json
      - name: npm audit (production deps, high+)
        working-directory: app/web
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies, high+)
        working-directory: app/web
        run: npm audit --audit-level=high --json > "${{ runner.temp }}/npm-audit-full.json"
      - name: Retain full dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-full
          path: ${{ runner.temp }}/npm-audit-full.json
          if-no-files-found: warn
          retention-days: 14
      - name: gitleaks (secret scan)
        # Run the open-source CLI directly; the wrapper action requires an org license.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --log-opts="--all" .

  pipeline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download React bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: src/security_lakehouse/web/dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0" # keep in step with the Dockerfile uv image
          enable-cache: true
      - name: Install (frozen)
        run: uv sync --frozen --all-extras
      - name: Validate sample evidence
        run: uv run grc-lake validate --raw data/raw/security_events.jsonl
      - name: Validate catalog and mappings
        run: uv run python -c "from security_lakehouse.catalog import validate_catalog; from security_lakehouse.programs import validate_program_catalog; errors = validate_catalog() + validate_program_catalog(); assert not errors, errors"
      - name: Validate connector access contracts
        run: uv run grc-lake connectors validate
      - name: Run pipeline smoke
        run: uv run grc-lake pipeline run --raw data/raw/security_events.jsonl --out build/lakehouse
      - name: Validate generated lake artifacts
        run: uv run python tools/validate_ci_artifacts.py --generated
      - name: Validate current posture API payload
        run: uv run grc-lake assessment status --lake build/lakehouse
      - name: Render dashboard
        run: uv run grc-lake dashboard --lake build/lakehouse --out build/dashboard/index.html
      - name: Verify dashboard artifact
        run: test -s build/dashboard/index.html && grep -q 'id="app-data"' build/dashboard/index.html
      - name: Run live API smoke
        env:
          GRC_LAKE_COOKIE_SIGNING_KEY: ci-test-cookie-signing-key
        run: uv run python tools/api_smoke.py

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download React bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: src/security_lakehouse/web/dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0" # keep in step with the Dockerfile uv image
          enable-cache: true
      - name: Install (frozen)
        run: uv sync --frozen --all-extras
      - name: Run Python test shard
        env:
          GRC_LAKE_COOKIE_SIGNING_KEY: ci-test-cookie-signing-key
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          COVERAGE_FILE: build/coverage-shard-${{ matrix.shard }}.data
        run: >-
          uv run python -m pytest -q -p tools.pytest_shard --ci-shard="$SHARD"
          --durations=10 --junitxml=build/pytest-results.xml
          --cov --cov-report=term-missing:skip-covered
          --cov-report=xml:build/coverage-shard-${{ matrix.shard }}.xml
      - name: Retain test results and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-${{ matrix.shard }}
          path: build/pytest-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Retain shard coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: |
            build/coverage-shard-${{ matrix.shard }}.xml
            build/coverage-shard-${{ matrix.shard }}.data
          if-no-files-found: warn
          retention-days: 14

  # Reporting only: no threshold, and not a dependency of the smoke gate.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: python-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0" # keep in step with the Dockerfile uv image
          enable-cache: true
      - name: Install (frozen)
        run: uv sync --frozen --extra dev
      - name: Download shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: build/coverage-shards
      - name: Combine and report
        run: |
          uv run coverage combine --keep build/coverage-shards/*.data
          uv run coverage report --skip-covered --sort=cover
          uv run coverage xml -o build/coverage.xml
          echo "Combined line+branch coverage: $(uv run coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain combined coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-combined
          path: build/coverage.xml
          if-no-files-found: error
          retention-days: 14

  # Keep the protected-branch check name stable. A failed, cancelled, or skipped
  # shard must fail this gate, including when an upstream web build fails.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [pipeline-smoke, python-tests, pre-commit, security, e2e, postgres-migrations]
    steps:
      - name: Require smoke, Python shards, hooks, security, browser and distributed contracts
        env:
          PIPELINE_RESULT: ${{ needs.pipeline-smoke.result }}
          TEST_RESULT: ${{ needs.python-tests.result }}
          HOOK_RESULT: ${{ needs.pre-commit.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          POSTGRES_RESULT: ${{ needs.postgres-migrations.result }}
        run: |
          test "$PIPELINE_RESULT" = success && test "$TEST_RESULT" = success && \
            test "$HOOK_RESULT" = success && test "$SECURITY_RESULT" = success && \
            test "$E2E_RESULT" = success && test "$POSTGRES_RESULT" = success

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable@pass%word
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0" # keep in step with the Dockerfile uv image
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra server --extra dev
      - name: Upgrade, downgrade, preserve data, and check model drift
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-disposable%40pass%25word@localhost:5432/postgres
        run: uv run pytest -q tests/test_migration_portability.py tests/test_agent_decision_authority.py tests/test_access_review_authority_state.py tests/test_authority_migration_data.py tests/test_operation_worker_fairness.py

      - name: Distributed PostgreSQL and S3 protocol contracts
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-disposable%40pass%25word@localhost:5432/postgres
        run: uv run --extra server --extra dev --extra cloud --extra parquet --extra analytics --with 'moto[server,s3]==5.2.3' pytest -q tests/test_distributed_*.py

  iceberg-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0" # keep in step with the Dockerfile uv image
          enable-cache: true
      - name: Install (frozen)
        run: uv sync --frozen --all-extras
      - name: Polaris REST and independent DuckDB snapshot verification
        run: uv run python tools/iceberg_rest_smoke.py

  deploy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.0
      - name: helm lint
        run: helm lint deploy/helm/grc-lake
      - name: helm template
        run: helm template grc-lake deploy/helm/grc-lake > /tmp/render.yaml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
      - name: Helm security and runtime contracts
        run: uv run --locked --extra dev pytest -q tests/test_helm_security.py tests/test_helm_runtime.py
      - name: terraform fmt
        run: terraform -chdir=deploy/eks-terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform -chdir=deploy/eks-terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir=deploy/eks-terraform validate
      - name: Terraform mocked deployment contracts
        run: terraform -chdir=deploy/eks-terraform test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: grc-lake:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: grc-lake:ci
          version: v0.70.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Exercise Compose quickstart against the built image
        run: python3 tools/compose_smoke.py --image grc-lake:ci
      - name: Clean up Compose smoke resources
        if: always()
        run: |
          if [ -f build/compose-smoke/project-name.txt ]; then
            touch build/compose-smoke/grc-lake.env
            docker compose -p "$(cat build/compose-smoke/project-name.txt)" \
              -f build/compose-smoke/compose.yaml -f build/compose-smoke/override.yaml down --volumes
            rm -f build/compose-smoke/grc-lake.env
          fi
      - name: Retain Compose smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-smoke
          path: |
            build/compose-smoke/result.json
            build/compose-smoke/container.log
          if-no-files-found: warn
          retention-days: 14

      - name: Qualify distributed replicas against real S3 storage
        run: python3 tools/qualify_distributed.py --image grc-lake:ci --out build/distributed-qualification
      - name: Clean up distributed qualification resources
        if: always()
        run: python3 tools/qualify_distributed.py --cleanup --out build/distributed-qualification
      - name: Retain sanitized distributed qualification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributed-qualification
          path: |
            build/distributed-qualification/report.json
            build/distributed-qualification/failure.json
            build/distributed-qualification/failure.log
          if-no-files-found: warn
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download React bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: src/security_lakehouse/web/dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0" # keep in step with the Dockerfile uv image
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/web/package-lock.json
      - name: Install Python (frozen)
        run: uv sync --frozen --all-extras
      - name: Install web deps
        working-directory: app/web
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: app/web
        run: npx playwright install chromium --with-deps
      - name: Console Playwright smoke
        env:
          GRC_LAKE_COOKIE_SIGNING_KEY: ci-e2e-cookie-signing-key
        run: bash tools/run_e2e_console.sh
