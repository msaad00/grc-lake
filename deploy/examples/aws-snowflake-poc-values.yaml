# AWS-hosted GRC Lake POC with Snowflake as the governed evidence lake.
#
# This file is intentionally renderable as-is for `helm template`, but the
# hostname, certificate ARN, Snowflake account, and IRSA role ARN must be changed for a real cluster.
# Snowflake object names match the GRC Lake bootstrap scripts.

image:
  repository: ghcr.io/msaad00/grc-lake
  tag: "" # inherit the checked-out release chart appVersion
  pullPolicy: IfNotPresent

security:
  requireAuthentication: true

replicaCount: 1

serviceAccount:
  create: true
  name: grc-lake
  annotations:
    # Replace with the EKS runtime role that can assume customer read-only
    # cloud-posture roles. Do not attach write/remediation permissions.
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/grc-lake-runtime-readonly

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/readyz
    # ALB terminates TLS using ACM, not a Kubernetes TLS Secret.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
  hosts:
    - host: grc-lake-poc.example.com
      paths:
        - path: /
          pathType: Prefix

lake:
  persistence:
    enabled: true
    size: 50Gi
    accessMode: ReadWriteOnce
    storageClassName: gp3 # provision an encrypted EBS CSI StorageClass first

scheduler:
  enabled: true
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid

env:
  - name: GRC_LAKE_ENV
    value: production
  - name: GRC_LAKE_COOKIE_SIGNING_KEY
    valueFrom:
      secretKeyRef:
        name: grc-lake-server
        key: GRC_LAKE_COOKIE_SIGNING_KEY
  - name: GRC_LAKE_PUBLIC_URL
    value: https://grc-lake-poc.example.com
  - name: GRC_LAKE_SESSION_SECRET
    valueFrom:
      secretKeyRef:
        name: grc-lake-server
        key: GRC_LAKE_SESSION_SECRET

  # Human auth. Point these at Auth0, Okta, Entra ID, Cognito, or another OIDC
  # provider before sharing a public URL.
  - name: GRC_LAKE_OIDC_ISSUER
    value: https://idp.example.com
  - name: GRC_LAKE_OIDC_CLIENT_ID
    value: grc-lake-poc
  - name: GRC_LAKE_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: grc-lake-oidc
        key: client_secret
  - name: GRC_LAKE_OIDC_TENANT_SLUG
    value: poc
  - name: GRC_LAKE_OIDC_AUTO_PROVISION
    value: "true"

  # Snowflake service-user key-pair auth. GRC Lake receives a mounted key file,
  # not a password or browser user credential.
  - name: SNOWFLAKE_ACCOUNT
    value: YOUR_ORG-YOUR_ACCOUNT
  - name: SNOWFLAKE_USER
    value: GRC_LAKE_INGEST_SVC
  - name: SNOWFLAKE_AUTHENTICATOR
    value: SNOWFLAKE_JWT
  - name: SNOWFLAKE_PRIVATE_KEY_FILE
    value: /var/run/secrets/grc-lake/snowflake_key.p8
  - name: SNOWFLAKE_ROLE
    value: GRC_LAKE_READER
  - name: SNOWFLAKE_WAREHOUSE
    value: GRC_LAKE_READ_WH
  - name: SNOWFLAKE_DATABASE
    value: GRC_LAKE_SECURITY_LAKE
  - name: SNOWFLAKE_SCHEMA
    value: EVIDENCE

extraVolumeMounts:
  - name: snowflake-key
    mountPath: /var/run/secrets/grc-lake
    readOnly: true

extraVolumes:
  - name: snowflake-key
    secret:
      secretName: grc-lake-snowflake-key

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi
