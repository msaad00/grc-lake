  <!-- Ingest -->
  <g>
    <rect x="300" y="228" width="156" height="320" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="378" cy="278" r="24" fill="#eef2ff"/>
    <path d="M368 277 h18 m-8 -8 8 8 -8 8" stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="328" y="324" class="label" font-size="17" font-weight="800">Ingest</text>
    <text x="318" y="352" class="subtitle">Pull or receive raw facts</text>
    <text x="318" y="370" class="subtitle">without changing sources</text>
    <text x="318" y="388" class="subtitle">or deciding compliance.</text>
    <rect x="318" y="412" width="96" height="22" rx="11" fill="#eef2ff"/>
    <text x="332" y="427" class="pill" fill="#4338ca">idempotent</text>
  </g>

  <!-- Lake -->
  <g>
    <rect x="488" y="168" width="236" height="380" rx="14" fill="url(#lake)" stroke="#bae6fd"/>
    <text x="508" y="200" class="label" font-size="17" font-weight="800">Evidence lake</text>
    <text x="508" y="222" class="muted" font-size="12">Customer-owned source of facts</text>

    <g transform="translate(508,244)">
      <rect width="196" height="54" rx="10" fill="#fff" stroke="#cbd5e1"/>
      <text x="14" y="22" class="title">Bronze raw</text>
      <text x="14" y="40" class="subtitle">raw_sha256 · replayable</text>

      <rect y="66" width="196" height="54" rx="10" fill="#fff" stroke="#cbd5e1"/>
      <text x="14" y="88" class="title">Silver facts</text>
      <text x="14" y="106" class="subtitle">normalized · deduped</text>

      <rect y="132" width="196" height="54" rx="10" fill="#fff" stroke="#cbd5e1"/>
      <text x="14" y="154" class="title">Gold posture</text>
      <text x="14" y="172" class="subtitle">control-ready views</text>
    </g>

    <text x="508" y="460" class="muted" font-size="11">Storage targets</text>
    <g transform="translate(508,472)">
      <rect width="96" height="32" rx="10" fill="#fff" stroke="#cbd5e1"/>
