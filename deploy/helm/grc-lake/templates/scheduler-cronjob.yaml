{{- if .Values.scheduler.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "grc-lake.fullname" . }}-scheduler
  labels:
    {{- include "grc-lake.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.scheduler.schedule | quote }}
  concurrencyPolicy: {{ .Values.scheduler.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.scheduler.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.scheduler.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "grc-lake.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "grc-lake.serviceAccountName" . }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
          {{- if and .Values.lake.persistence.enabled (not .Values.lake.readOnly) (eq .Values.lake.persistence.accessMode "ReadWriteOnce") }}
          # A ReadWriteOnce lake volume is mountable read-write from a single
          # node only. Pin the scheduler to the API pod's node so both can mount
          # it; otherwise the CronJob can be scheduled elsewhere and fail to
          # mount the PVC. ReadWriteMany changes mountability, not the single-writer contract.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      {{- include "grc-lake.selectorLabels" . | nindent 22 }}
                  topologyKey: kubernetes.io/hostname
          {{- end }}
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: scheduler
              image: {{ include "grc-lake.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              args:
                - grc-lake
                - scheduler
                - tick
                {{- if and .Values.scheduler.allTenants (not .Values.security.allowInsecureNoAuth) }}
                - --all-tenants
                {{- end }}
                - --lake
                - {{ .Values.lake.mountPath | quote }}
              env:
                - name: GRC_LAKE_LAKE
                  value: {{ .Values.lake.mountPath | quote }}
                {{- with .Values.scheduler.retention }}
                {{- if .schedule }}
                - name: GRC_LAKE_RETENTION_SCHEDULE
                  value: {{ .schedule | quote }}
                - name: GRC_LAKE_RETENTION_OLDER_THAN_DAYS
                  value: {{ .olderThanDays | toString | quote }}
                - name: GRC_LAKE_RETENTION_KEEP_LATEST
                  value: {{ .keepLatest | toString | quote }}
                {{- if .archiveDir }}
                - name: GRC_LAKE_RETENTION_ARCHIVE_DIR
                  value: {{ .archiveDir | quote }}
                {{- end }}
                {{- end }}
                {{- end }}
                {{- with .Values.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: lake
                  mountPath: {{ .Values.lake.mountPath }}
                  readOnly: false
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/trustops
                {{- with .Values.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            - name: lake
              {{- if .Values.lake.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "grc-lake.fullname" . }}-lake
              {{- else }}
              emptyDir: {}
              {{- end }}
            - name: tmp
              emptyDir: {}
            - name: home
              emptyDir: {}
            {{- with .Values.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
