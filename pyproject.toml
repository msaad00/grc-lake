[build-system]
requires = ["setuptools>=68.0,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustops-security-data-lake"
version = "0.2.17"
description = "Open-source, self-hosted trust operations — SOC 2, NIST AI RMF, FedRAMP, ISO, HIPAA, PCI DSS. Read-only evidence collection, deterministic control tests, and audit-ready proof with an API-first, MCP-native design."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mohamed Saad" }]
keywords = [
    "compliance", "soc2", "nist", "fedramp", "hipaa", "pci-dss", "iso27001",
    "grc", "devsecops", "audit", "security", "evidence", "controls",
    "mcp", "agents", "data-lake",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/msaad00/trustops-security-data-lake"
Documentation = "https://github.com/msaad00/trustops-security-data-lake/tree/main/docs"
Repository = "https://github.com/msaad00/trustops-security-data-lake"
Changelog = "https://github.com/msaad00/trustops-security-data-lake/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/msaad00/trustops-security-data-lake/issues"

[project.optional-dependencies]
# Server mode: the ASGI platform surface for auth, multi-tenancy, and live
# connectors. Local mode stays zero-dependency (`pip install trustops-security-data-lake`).
server = [
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "python3-saml>=1.16",
    "reportlab>=5.0.1",
    "redis>=8.1.0",
]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.0",
    "ruff>=0.8.0",
    # supply-chain scan + pre-commit driver
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "commitizen>=3.27",
    # server-mode parity + app-state tests (SQLite-backed, no Postgres needed)
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "python3-saml>=1.16",
    "reportlab>=5.0.1",
    "redis>=8.1.0",
    # Snowflake sink load-path tests (write_pandas dataframe build).
    "pandas>=2.0",
]
# Portable evidence files; optional so local JSONL mode stays dependency-free.
parquet = [
    "pyarrow>=23.0.1,<26",
]
# Optional Iceberg REST publication; basic local mode remains dependency-free.
iceberg = [
    "pyiceberg[pyarrow]>=0.12.0,<0.13",
    "pyarrow>=23.0.1,<26",
]
analytics = [
    "duckdb>=1.0",
]
# Live cloud connector SDKs. The core package stays dependency-free; install
# this extra only when running AWS, Azure, GCP, or Snowflake collection locally.
cloud = [
    "boto3>=1.34",
    "azure-identity>=1.17",
    "azure-mgmt-authorization>=4.0",
    # Keep the bundled stable resource and policy clients used by the collector.
    "azure-mgmt-resource>=23.0,<24",

    "google-cloud-asset>=3.20",
    "google-cloud-resource-manager>=1.12",
    "google-cloud-org-policy>=1.11",
    "snowflake-connector-python[pandas]>=4.7.1",
    "clickhouse-connect>=0.7",
]
# Agent-native front door: the Model Context Protocol server that exposes the
# read surface over stdio so an agent can query posture headlessly.
mcp = [
    "mcp>=1.2.0,<2",
]
# Typed Python client (`TrustOpsClient`) over the `/api/v1` surface so agents
# and scripts share the same contract as humans
# (`pip install trustops-security-data-lake[sdk]`).
sdk = [
    "httpx>=0.28.1",
]
# Optional human/headless agent orchestration harness. The core assessment
# engine must not depend on LangGraph or an LLM.
agents = [
    "langgraph>=0.2.0",
]

# Conventional commits — used by the pre-commit `commitizen` hook to
# validate every commit message format.
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.17"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"

[project.scripts]
security-lakehouse = "security_lakehouse.cli:main"
# Agent-native front door: stdio MCP server over the existing read surface.
# Requires the optional `mcp` extra (`pip install 'trustops-security-data-lake[mcp]'`).
trustops-mcp = "security_lakehouse.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"security_lakehouse" = [
    "web/dist/**/*",
    "web/dist/.gitkeep",
    "static/*.svg",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]

[tool.setuptools.data-files]
"mockup_companies/ai_lab/raw" = ["mockup_companies/ai_lab/raw/security_events.jsonl"]
"mockup_companies/fintech/raw" = ["mockup_companies/fintech/raw/security_events.jsonl"]
"mockup_companies/golden/raw" = ["mockup_companies/golden/raw/security_events.jsonl"]
"mockup_companies/healthcare/raw" = ["mockup_companies/healthcare/raw/security_events.jsonl"]
"mockup_companies/saas/raw" = ["mockup_companies/saas/raw/security_events.jsonl"]
"connectors" = ["connectors/catalog.json"]
"controls" = ["controls/bundle.lock.json", "controls/catalog.json", "controls/safeguards.json", "controls/history.jsonl", "controls/families.json"]
"frameworks" = ["frameworks/registry.json", "frameworks/verified_article_ids.json"]
"mappings" = ["mappings/control_articles.json", "mappings/control_map.json", "mappings/remediation_guidance.json", "mappings/framework_equivalence.json"]
"programs" = ["programs/catalog.json", "programs/vendor_questionnaires.json"]
"policy_templates" = ["policy_templates/catalog.json"]

"agent-skills" = ["agent-skills/FRAMEWORK_SKILLS.md"]
"agent-skills/ai-governance-analyst" = ["agent-skills/ai-governance-analyst/SKILL.md"]
"agent-skills/ai-governance-analyst/references" = ["agent-skills/ai-governance-analyst/references/sources.md"]
"agent-skills/compliance-analytics" = ["agent-skills/compliance-analytics/SKILL.md"]
"agent-skills/iso27001-isms-analyst" = ["agent-skills/iso27001-isms-analyst/SKILL.md"]
"agent-skills/iso27001-isms-analyst/references" = ["agent-skills/iso27001-isms-analyst/references/sources.md"]
"agent-skills/pci-dss-analyst" = ["agent-skills/pci-dss-analyst/SKILL.md"]
"agent-skills/pci-dss-analyst/references" = ["agent-skills/pci-dss-analyst/references/sources.md"]
"agent-skills/security-operations-analyst" = ["agent-skills/security-operations-analyst/SKILL.md"]
"agent-skills/soc2-control-analyst" = ["agent-skills/soc2-control-analyst/SKILL.md"]
"agent-skills/soc2-control-analyst/references" = ["agent-skills/soc2-control-analyst/references/sources.md"]
"agent-skills/trustops-operator" = ["agent-skills/trustops-operator/SKILL.md"]

"frameworks/packs/data" = ["frameworks/packs/data/cis_aws_v3.json", "frameworks/packs/data/cmmc_2_level2.json", "frameworks/packs/data/evidence_connector_hints.json", "frameworks/packs/data/iso_27017_2015.json", "frameworks/packs/data/nist_800_53_rev5_moderate.json", "frameworks/packs/data/nist_csf_2_core.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated once and used as defaults
# by design; they are not the mutable-default footgun B008 targets.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]
