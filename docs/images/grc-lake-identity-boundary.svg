<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">GRC Lake identity boundary</title>
  <desc id="desc">OIDC, SAML, and API keys resolve to tenant-scoped users, RBAC scopes, and audited sessions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#3b4a5f"/></marker>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <style>
      .t { font-family: Inter, Arial, sans-serif; fill: #0f172a; }
      .m { font-family: Inter, Arial, sans-serif; fill: #62718a; }
      .p { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 800; }
    </style>
  </defs>
  <rect width="1200" height="480" fill="#eef3f8"/>
  <rect x="36" y="28" width="1128" height="424" rx="22" fill="#fff" stroke="#d7e0ec"/>

  <text x="72" y="78" class="t" font-size="28" font-weight="850">One identity boundary</text>
  <text x="72" y="108" class="m" font-size="15">OIDC, SAML, and API keys share tenant, role, scopes, and audit.</text>

  <g>
    <rect x="72" y="140" width="220" height="260" rx="16" fill="#f8fafc" stroke="#d5deea"/>
    <text x="96" y="176" class="t" font-size="18" font-weight="850">Sign-in</text>
    <rect x="96" y="196" width="172" height="40" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="112" y="222" class="p" fill="#2563eb">OIDC SSO</text>
    <rect x="96" y="248" width="172" height="40" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="112" y="274" class="p" fill="#6d28d9">SAML 2.0</text>
    <rect x="96" y="300" width="172" height="40" rx="10" fill="#ecfdf5" stroke="#86efac"/>
    <text x="112" y="326" class="p" fill="#047857">API key / session</text>
    <rect x="96" y="352" width="172" height="32" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="112" y="373" class="p" fill="#9a3412" font-size="11">SCIM (hosted)</text>
  </g>

  <g>
    <rect x="338" y="140" width="280" height="260" rx="16" fill="url(#core)"/>
    <text x="362" y="176" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">GRC Lake auth</text>
    <g transform="translate(362,200)">
      <rect width="232" height="34" rx="8" fill="#1f2a3a"/>
      <text x="14" y="22" fill="#e5f0ff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Map email ? user + IdP roles</text>
      <rect y="44" width="232" height="34" rx="8" fill="#1f2a3a"/>
      <text x="14" y="66" fill="#e5f0ff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Tenant scope</text>
      <rect y="88" width="232" height="34" rx="8" fill="#1f2a3a"/>
      <text x="14" y="110" fill="#e5f0ff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Role + RBAC scopes</text>
      <rect y="132" width="232" height="34" rx="8" fill="#1f2a3a"/>
      <text x="14" y="154" fill="#e5f0ff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Signed session cookie</text>
    </g>
  </g>

  <g>
    <rect x="664" y="140" width="220" height="260" rx="16" fill="#f8fafc" stroke="#d5deea"/>
    <text x="688" y="176" class="t" font-size="18" font-weight="850">Protected</text>
    <text x="688" y="210" class="m" font-size="13">Console + audit room</text>
    <text x="688" y="236" class="m" font-size="13">/api/v1 + MCP agents</text>
    <text x="688" y="262" class="m" font-size="13">Users, keys, invites</text>
    <rect x="688" y="288" width="168" height="28" rx="14" fill="#dcfce7"/>
    <text x="704" y="307" class="p" fill="#166534">audit every request</text>
  </g>

  <g>
    <rect x="930" y="140" width="200" height="260" rx="16" fill="#fff7ed" stroke="#fdba74"/>
    <text x="954" y="176" class="t" font-size="18" font-weight="850">IdP marks</text>
    <text x="954" y="206" class="m" font-size="12">Okta · Entra ID</text>
    <text x="954" y="228" class="m" font-size="12">Google · Auth0</text>
    <text x="954" y="260" class="m" font-size="11">Neutral text badges</text>
    <text x="954" y="278" class="m" font-size="11">not official logos</text>
  </g>

  <g stroke="#3b4a5f" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M292 270 H338"/>
    <path d="M618 270 H664"/>
    <path d="M884 270 H930"/>
  </g>
</svg>
