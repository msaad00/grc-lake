<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">GRC Lake ClickHouse telemetry security data lake architecture</title>
  <desc id="desc">A lane-based architecture diagram showing ClickHouse hot telemetry ingest, materialized views, TTL retention, GRC Lake evaluation, workflows, snapshots, and audited write-back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.58" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#10243f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <linearGradient id="audit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#581c2b"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#17304b" stroke-width="1" opacity="0.34"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
    <marker id="arrowCyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 13 6.5 0 13z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 13 6.5 0 13z" fill="#34d399"/>
    </marker>
    <marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 13 6.5 0 13z" fill="#facc15"/>
    </marker>
    <marker id="arrowRose" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 13 6.5 0 13z" fill="#fb7185"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .title { fill: #f8fafc; font-size: 34px; font-weight: 900; letter-spacing: -0.02em; }
      .subtitle { fill: #cbd5e1; font-size: 14px; font-weight: 650; }
      .lane { fill: #67e8f9; font-size: 11px; font-weight: 900; letter-spacing: 0.18em; }
      .lanePurple { fill: #c4b5fd; font-size: 11px; font-weight: 900; letter-spacing: 0.18em; }
      .laneRose { fill: #fecdd3; font-size: 11px; font-weight: 900; letter-spacing: 0.18em; }
      .cardTitle { fill: #ffffff; font-size: 18px; font-weight: 900; }
      .cardText { fill: #dbeafe; font-size: 12px; font-weight: 650; }
      .muted { fill: #cbd5e1; font-size: 11px; font-weight: 700; }
      .tiny { fill: #cbd5e1; font-size: 10px; font-weight: 700; }
      .code { fill: #e0f2fe; font-size: 12px; font-weight: 850; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.4; }
      .signal { fill: #101b2d; stroke: #334155; stroke-width: 1.25; }
      .cyanBox { fill: rgba(14, 116, 144, 0.30); stroke: #38bdf8; stroke-width: 1.4; }
      .goldBox { fill: rgba(161, 98, 7, 0.46); stroke: #facc15; stroke-width: 1.4; }
      .greenBox { fill: rgba(6, 78, 59, 0.82); stroke: #34d399; stroke-width: 1.35; }
      .purpleBox { fill: rgba(49, 46, 129, 0.72); stroke: #a78bfa; stroke-width: 1.3; }
      .roseBox { fill: rgba(127, 29, 29, 0.74); stroke: #fb7185; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="url(#bg)"/>
  <rect width="1500" height="900" fill="url(#grid)" opacity="0.92"/>
  <circle cx="1192" cy="202" r="218" fill="none" stroke="#facc15" stroke-width="2" opacity="0.16"/>
  <circle cx="1242" cy="648" r="180" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.18"/>

  <g class="sans">
    <text x="64" y="66" class="title">ClickHouse Telemetry Lake for GRC Lake</text>
    <text x="64" y="96" class="subtitle">Hot-path security telemetry, fast rollups, retention-aware tables, and closed-loop trust workflows in the customer's boundary.</text>

    <g transform="translate(1142 36)" filter="url(#shadow)">
      <rect width="292" height="76" rx="17" class="box"/>
      <svg x="22" y="14" width="44" height="44" viewBox="0 0 24 24"><path fill="#FAFF04" d="M21.333 10H24v4h-2.667ZM16 1.335h2.667v21.33H16Zm-5.333 0h2.666v21.33h-2.666ZM0 22.665V1.335h2.667v21.33zm5.333-21.33H8v21.33H5.333Z"/></svg>
      <text x="92" y="31" class="cardTitle" font-size="16">ClickHouse pack</text>
      <text x="92" y="52" class="tiny">MergeTree · TTL · materialized views</text>
    </g>

    <g transform="translate(64 148)">
      <rect width="160" height="30" rx="15" fill="#0e7490" stroke="#22d3ee"/>
      <text x="80" y="20" text-anchor="middle" class="lane">HOT LANE</text>
    </g>

    <g transform="translate(64 208)" filter="url(#shadow)">
      <rect width="306" height="284" rx="22" class="box"/>
      <text x="26" y="44" class="cardTitle">High-volume signals</text>
      <text x="26" y="66" class="cardText">Security events that need fast slices.</text>
      <g transform="translate(26 96)">
        <rect width="112" height="52" rx="11" class="signal"/>
        <svg x="11" y="12" width="28" height="28" viewBox="0 0 24 24"><path fill="#fbbf24" d="M9 2h2v2h2V2h2v2h1a3 3 0 0 1 3 3v1h2v2h-2v2h2v2h-2v1a3 3 0 0 1-3 3h-1v2h-2v-2h-2v2H9v-2H8a3 3 0 0 1-3-3v-1H3v-2h2v-2H3V8h2V7a3 3 0 0 1 3-3h1V2zm-.5 6.5v7h7v-7h-7z"/></svg>
        <text x="50" y="24" class="code">Runtime</text>
        <text x="50" y="40" class="tiny">agents · MCP</text>
      </g>
      <g transform="translate(166 96)">
        <rect width="112" height="52" rx="11" class="signal"/>
        <svg x="11" y="13" width="28" height="28" viewBox="0 0 24 24"><path fill="#60a5fa" d="M6.5 19a4.5 4.5 0 0 1-.62-8.96 6 6 0 0 1 11.65-1.2A4.5 4.5 0 0 1 17.5 19h-11z"/></svg>
        <text x="50" y="24" class="code">Cloud</text>
        <text x="50" y="40" class="tiny">flow · audit</text>
      </g>
      <g transform="translate(26 164)">
        <rect width="112" height="52" rx="11" class="signal"/>
        <svg x="11" y="12" width="28" height="28" viewBox="0 0 24 24"><path fill="#007DC1" d="M12 0C5.389 0 0 5.35 0 12s5.35 12 12 12 12-5.35 12-12S18.611 0 12 0zm0 18c-3.325 0-6-2.675-6-6s2.675-6 6-6 6 2.675 6 6-2.675 6-6 6z"/></svg>
        <text x="50" y="24" class="code">Identity</text>
        <text x="50" y="40" class="tiny">Okta · group</text>
      </g>
      <g transform="translate(166 164)">
        <rect width="112" height="52" rx="11" class="signal"/>
        <svg x="11" y="12" width="28" height="28" viewBox="0 0 24 24"><path fill="#e5e7eb" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        <text x="50" y="24" class="code">Repos</text>
        <text x="50" y="40" class="tiny">push · config</text>
      </g>
      <g transform="translate(26 232)">
        <rect width="112" height="38" rx="10" class="signal"/>
        <text x="18" y="23" class="code">Detections</text>
      </g>
      <g transform="translate(166 232)">
        <rect width="112" height="38" rx="10" class="signal"/>
        <text x="18" y="23" class="code">Scanners</text>
      </g>
    </g>

    <g transform="translate(432 204)" filter="url(#shadow)">
      <rect width="248" height="288" rx="20" fill="url(#teal)" stroke="#22d3ee" stroke-width="1.8"/>
      <text x="28" y="46" class="cardTitle">Normalize</text>
      <text x="28" y="68" class="cardText">Append-only OCSF-like rows.</text>
      <rect x="28" y="98" width="192" height="40" rx="10" class="cyanBox"/>
      <text x="124" y="123" text-anchor="middle" class="code">sink-clickhouse-jsonl</text>
      <rect x="28" y="152" width="192" height="40" rx="10" class="cyanBox"/>
      <text x="124" y="177" text-anchor="middle" class="code">event_uid / finding_uid</text>
      <rect x="28" y="206" width="192" height="40" rx="10" class="cyanBox"/>
      <text x="124" y="231" text-anchor="middle" class="code">dry-run first</text>
      <text x="28" y="268" class="tiny">dedupe-aware replay windows</text>
    </g>

    <g transform="translate(756 162)" filter="url(#shadow)">
      <rect width="450" height="368" rx="24" fill="url(#lake)" stroke="#facc15" stroke-width="2.2"/>
      <text x="34" y="50" class="cardTitle" font-size="24">ClickHouse hot telemetry lake</text>
      <text x="34" y="75" class="cardText">Pre-provisioned tables; skills hold no DDL rights.</text>
      <g transform="translate(34 108)">
        <rect width="176" height="58" rx="12" class="goldBox"/>
        <text x="18" y="27" class="code">events_sink</text>
        <text x="18" y="43" class="tiny">90-day hot tier</text>
      </g>
      <g transform="translate(240 108)">
        <rect width="176" height="58" rx="12" class="goldBox"/>
        <text x="18" y="27" class="code">findings_sink</text>
        <text x="18" y="43" class="tiny">365-day history</text>
      </g>
      <g transform="translate(34 188)">
        <rect width="176" height="58" rx="12" class="goldBox"/>
        <text x="18" y="27" class="code">evidence_sink</text>
        <text x="18" y="43" class="tiny">control joins</text>
      </g>
      <g transform="translate(240 188)">
        <rect width="176" height="58" rx="12" class="goldBox"/>
        <text x="18" y="27" class="code">audit_sink</text>
        <text x="18" y="43" class="tiny">decision trail</text>
      </g>
      <g transform="translate(34 272)">
        <rect width="382" height="58" rx="12" fill="#78350f" stroke="#facc15" stroke-width="1.3" stroke-dasharray="8 6"/>
        <text x="191" y="25" text-anchor="middle" class="code">incremental materialized views</text>
        <text x="191" y="43" text-anchor="middle" class="tiny">rule volume · class volume · remediation outcomes</text>
      </g>
      <text x="34" y="348" class="tiny">MergeTree order keys · TTL retention · row policies · fast aggregates</text>
    </g>

    <g transform="translate(1252 190)" filter="url(#shadow)">
      <rect width="180" height="290" rx="20" fill="#0f172a" stroke="#facc15" stroke-width="1.4"/>
      <text x="22" y="40" class="cardTitle">Fast reads</text>
      <text x="22" y="64" class="cardText">Query posture at event scale.</text>
      <rect x="22" y="96" width="136" height="40" rx="10" class="purpleBox"/>
      <text x="90" y="121" text-anchor="middle" class="code">SELECT only</text>
      <rect x="22" y="150" width="136" height="40" rx="10" class="purpleBox"/>
      <text x="90" y="175" text-anchor="middle" class="code">source query</text>
      <rect x="22" y="204" width="136" height="40" rx="10" class="purpleBox"/>
      <text x="90" y="229" text-anchor="middle" class="code">dashboards</text>
      <text x="22" y="272" class="tiny">read-only SQL allowlist</text>
    </g>

    <line x1="370" y1="350" x2="416" y2="350" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <line x1="680" y1="350" x2="742" y2="350" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <line x1="1206" y1="350" x2="1238" y2="350" stroke="#facc15" stroke-width="4" marker-end="url(#arrowGold)"/>

    <g transform="translate(64 586)">
      <rect width="178" height="30" rx="15" fill="#3b0764" stroke="#a78bfa"/>
      <text x="89" y="20" text-anchor="middle" class="lanePurple">TRUSTOPS LOOP</text>
    </g>

    <g transform="translate(64 642)" filter="url(#shadow)">
      <rect width="266" height="132" rx="18" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
      <text x="26" y="38" class="cardTitle">Evaluate</text>
      <text x="26" y="64" class="cardText">controls-as-code over</text>
      <text x="26" y="86" class="cardText">fresh telemetry slices</text>
      <text x="26" y="110" class="cardText">confidence from lineage</text>
    </g>

    <g transform="translate(408 642)" filter="url(#shadow)">
      <rect width="266" height="132" rx="18" fill="url(#purple)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="26" y="38" class="cardTitle">Route work</text>
      <text x="26" y="64" class="cardText">workflow DAG actions</text>
      <text x="26" y="86" class="cardText">owner, SLA, exception</text>
      <text x="26" y="110" class="cardText">ticket/webhook guardrails</text>
    </g>

    <g transform="translate(752 642)" filter="url(#shadow)">
      <rect width="266" height="132" rx="18" class="roseBox"/>
      <text x="26" y="38" class="cardTitle">Write back</text>
      <text x="26" y="64" class="cardText">remediation evidence</text>
      <text x="26" y="86" class="cardText">audited action record</text>
      <text x="26" y="110" class="cardText">duplicate-safe UID</text>
    </g>

    <g transform="translate(1096 642)" filter="url(#shadow)">
      <rect width="338" height="132" rx="18" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
      <text x="26" y="38" class="cardTitle">Customer-owned boundary</text>
      <text x="26" y="64" class="cardText">endpoints, TLS, retention,</text>
      <text x="26" y="86" class="cardText">dashboards, credentials,</text>
      <text x="26" y="110" class="cardText">and query history stay there.</text>
    </g>

    <line x1="330" y1="708" x2="394" y2="708" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <line x1="674" y1="708" x2="738" y2="708" stroke="#fb7185" stroke-width="4" marker-end="url(#arrowRose)"/>
    <line x1="1018" y1="708" x2="1082" y2="708" stroke="#fb7185" stroke-width="4" marker-end="url(#arrowRose)"/>
    <path d="M888 642V530" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowGreen)"/>
    <path d="M902 642C902 560 1110 560 1188 530" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowRose)"/>

    <g transform="translate(64 830)">
      <circle cx="0" cy="0" r="5" fill="#22d3ee"/><text x="16" y="4" class="tiny">write/read</text>
      <circle cx="112" cy="0" r="5" fill="#34d399"/><text x="128" y="4" class="tiny">evaluate</text>
      <circle cx="218" cy="0" r="5" fill="#fb7185"/><text x="234" y="4" class="tiny">audit write-back</text>
      <text x="402" y="4" class="tiny">GRC Lake uses ClickHouse for hot telemetry and keeps durable evidence auditable.</text>
    </g>
  </g>
</svg>
