<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AWS STS AssumeRole lifecycle</title>
  <desc id="desc">GRC Lake stores role metadata, calls STS AssumeRole during a test or scheduled sync, receives short-lived session credentials, reads IAM posture APIs, and lets the temporary credentials expire.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#334155"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-weight: 850; fill: #0f172a; }
      .label { font-family: Inter, Arial, sans-serif; font-weight: 800; fill: #0f172a; }
      .body { font-family: Inter, Arial, sans-serif; fill: #475569; }
      .pill { font-family: Inter, Arial, sans-serif; font-weight: 800; fill: #0f766e; }
    </style>
  </defs>
  <rect width="1200" height="420" rx="0" fill="#eef3f8"/>
  <rect x="36" y="28" width="1128" height="364" rx="24" fill="#ffffff" stroke="#d7e0ec"/>
  <text x="72" y="76" class="title" font-size="28">AWS auth boundary: scheduled read-only STS sessions</text>
  <text x="72" y="104" class="body" font-size="16">GRC Lake never asks for long-lived access keys. Each probe or scheduled sync assumes the</text>
  <text x="72" y="126" class="body" font-size="16">customer role, reads posture evidence, and lets the temporary credentials expire.</text>

  <g transform="translate(72,146)">
    <rect width="192" height="142" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="22" y="34" class="label" font-size="15">1. Authorize</text>
    <text x="22" y="66" class="body" font-size="13">Customer deploys</text>
    <text x="22" y="86" class="body" font-size="13">read-only IAM role</text>
    <text x="22" y="114" class="pill" font-size="12">External ID trust</text>
  </g>

  <g transform="translate(302,146)">
    <rect width="192" height="142" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="22" y="34" class="label" font-size="15">2. Store metadata</text>
    <text x="22" y="66" class="body" font-size="13">account ID</text>
    <text x="22" y="86" class="body" font-size="13">role ARN</text>
    <text x="22" y="106" class="body" font-size="13">external ID</text>
    <text x="22" y="126" class="pill" font-size="12">no access keys</text>
  </g>

  <g transform="translate(532,146)">
    <rect width="192" height="142" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="22" y="34" class="label" font-size="15">3. Scheduled sync</text>
    <text x="22" y="66" class="body" font-size="13">STS AssumeRole</text>
    <text x="22" y="86" class="body" font-size="13">with External ID</text>
    <text x="22" y="114" class="pill" font-size="12">short-lived session</text>
  </g>

  <g transform="translate(762,146)">
    <rect width="192" height="142" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="22" y="34" class="label" font-size="15">4. Read evidence</text>
    <text x="22" y="66" class="body" font-size="13">read-only IAM</text>
    <text x="22" y="86" class="body" font-size="13">posture APIs</text>
    <text x="22" y="114" class="pill" font-size="12">no write actions</text>
  </g>

  <g transform="translate(992,146)">
    <rect width="120" height="142" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="34" class="label" font-size="15">5. Expire</text>
    <text x="18" y="66" class="body" font-size="13">temporary</text>
    <text x="18" y="86" class="body" font-size="13">credentials</text>
    <text x="18" y="106" class="body" font-size="13">expire</text>
  </g>

  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M264 217 H302"/>
    <path d="M494 217 H532"/>
    <path d="M724 217 H762"/>
    <path d="M954 217 H992"/>
  </g>

  <rect x="72" y="316" width="1040" height="60" rx="20" fill="#f8fafc" stroke="#d7e0ec"/>
  <text x="94" y="340" class="body" font-size="14">Continuous posture = repeated scheduled syncs. Every run re-authenticates with STS AssumeRole,</text>
  <text x="94" y="360" class="body" font-size="14">uses short-lived session credentials, and reads only allowed IAM posture evidence.</text>
</svg>
