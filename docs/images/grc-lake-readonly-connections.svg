<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">GRC Lake read-only connector model</title>
  <desc id="desc">AWS IAM assume-role, GitHub App token, Okta API token, and Snowflake SELECT grants connect read-only into the GRC Lake ingestion path.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#3b4a5f"/></marker>
    <style>
      .t { font-family: Inter, Arial, sans-serif; fill: #0f172a; }
      .m { font-family: Inter, Arial, sans-serif; fill: #62718a; }
      .p { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 800; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#eef3f8"/>
  <rect x="36" y="28" width="1128" height="464" rx="22" fill="#fff" stroke="#d7e0ec"/>

  <text x="72" y="78" class="t" font-size="28" font-weight="850">Read-only connections (enterprise GRC)</text>
  <text x="72" y="108" class="m" font-size="15">APIs, cross-account IAM roles, and scoped tokens — no admin or write access.</text>

  <!-- Sources -->
  <g>
    <rect x="72" y="140" width="250" height="300" rx="16" fill="#f8fafc" stroke="#d5deea"/>
    <text x="96" y="176" class="t" font-size="18" font-weight="850">Your sources</text>
    <g transform="translate(96,200)">
      <rect width="200" height="44" rx="10" fill="#fff7ed" stroke="#fdba74"/>
      <text x="14" y="20" class="p" fill="#c2410c">AWS</text>
      <text x="14" y="36" class="m" font-size="11">IAM role + External ID</text>
      <rect y="56" width="200" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
      <text x="14" y="76" class="p" fill="#24292f">GitHub</text>
      <text x="14" y="92" class="m" font-size="11">App installation token</text>
      <rect y="112" width="200" height="44" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="14" y="132" class="p" fill="#007DC1">Okta</text>
      <text x="14" y="148" class="m" font-size="11">Read-only API token</text>
      <rect y="168" width="200" height="44" rx="10" fill="#ecfeff" stroke="#67e8f9"/>
      <text x="14" y="188" class="p" fill="#0891b2">Snowflake</text>
      <text x="14" y="204" class="m" font-size="11">Key-pair SELECT on views</text>
    </g>
  </g>

  <!-- Pipeline -->
  <g>
    <rect x="370" y="140" width="360" height="300" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="394" y="176" class="t" font-size="18" font-weight="850">GRC Lake ingestion</text>
    <g transform="translate(394,200)">
      <rect width="140" height="36" rx="9" fill="#fff" stroke="#cbd5e1"/>
      <text x="14" y="23" class="p">Discover</text>
      <rect x="156" width="140" height="36" rx="9" fill="#fff" stroke="#cbd5e1"/>
      <text x="170" y="23" class="p">Probe</text>
      <rect y="52" width="296" height="36" rx="9" fill="#fff" stroke="#cbd5e1"/>
      <text x="14" y="75" class="p">Sync scheduler (read-only pull)</text>
      <rect y="104" width="296" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/>
      <text x="14" y="128" class="p">Bronze ’ Silver ’ Gold</text>
      <text x="14" y="150" class="m" font-size="12">Your /lake boundary</text>
      <text x="14" y="172" class="m" font-size="12">raw_sha256 + deterministic tests</text>
    </g>
  </g>

  <!-- Compare -->
  <g>
    <rect x="778" y="140" width="350" height="300" rx="16" fill="#f8fafc" stroke="#d5deea"/>
    <text x="802" y="176" class="t" font-size="18" font-weight="850">vs typical GRC SaaS</text>
    <g transform="translate(802,200)" class="m" font-size="13">
      <text y="0" class="t" font-size="14" font-weight="800">Same connect pattern</text>
      <text y="28">• Read-only IAM / OAuth / tokens</text>
      <text y="52">• Scheduled API polling</text>
      <text y="76">• Automated control tests</text>
      <text y="116" class="t" font-size="14" font-weight="800">Different boundary</text>
      <text y="144">• Vendor-owned evidence DB</text>
      <text y="168" class="t" font-size="13" font-weight="700" fill="#047857">• GRC Lake: your lake + warehouse</text>
    </g>
  </g>

  <g stroke="#3b4a5f" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M322 290 H370"/>
    <path d="M730 290 H778"/>
  </g>
</svg>
