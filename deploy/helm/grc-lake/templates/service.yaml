{{- if not (and .Values.distributed.enabled (eq .Values.distributed.role "worker")) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grc-lake.fullname" . }}
  labels:
    {{- include "grc-lake.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "grc-lake.selectorLabels" . | nindent 4 }}

{{- end }}
