AWSTemplateFormatVersion: "2010-09-09"
Description: GRC Lake read-only AWS posture and inventory collection role.

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: ARN of the AWS principal allowed to assume this role.
    AllowedPattern: "^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:(role|user|root)(/.+)?$"
  ExternalId:
    Type: String
    Description: External ID condition for cross-account assumption.
    MinLength: 8
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9+=,.@:/_-]+$"
    NoEcho: true
  RoleName:
    Type: String
    Description: Name for the GRC Lake read-only posture role.
    Default: GrcLakePostureReadOnlyRole
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"

Resources:
  GrcLakePostureReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: RoleName
      Description: Read-only role for GRC Lake AWS IAM posture evidence collection.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GrcLakeAssumeRole
            Effect: Allow
            Principal:
              AWS:
                Ref: TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      Policies:
        - PolicyName: GrcLakePostureReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: GrcLakeIamPostureReadOnly
                Effect: Allow
                Action:
                  - iam:GetAccountPasswordPolicy
                  - iam:GetAccountSummary
                  - iam:GetLoginProfile
                  - iam:ListAccessKeys
                  - iam:ListMFADevices
                  - iam:ListUsers
                Resource: "*"
              - Sid: GrcLakeInventoryReadOnly
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeRegions
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - rds:DescribeDBInstances
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConfigurationRecorderStatus
                  - securityhub:DescribeHub
                  - securityhub:GetEnabledStandards
                  - organizations:DescribeOrganization
                  - organizations:ListAccounts
                Resource: "*"

Outputs:
  RoleArn:
    Description: ARN to configure as the AWS posture connector's read-only role.
    Value:
      Fn::GetAtt:
        - GrcLakePostureReadOnlyRole
        - Arn
