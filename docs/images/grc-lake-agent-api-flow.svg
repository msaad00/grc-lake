<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">GRC Lake human and agent API flow</title>
  <desc id="desc">A bounded flow diagram showing humans, agents, CI, and MCP clients using the same RBAC-protected GRC Lake API to read posture, run skills, validate evidence, and write audited actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.58" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#0b3d44"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#17304b" stroke-width="1" opacity="0.32"/>
    </pattern>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 13 6.5 0 13z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 13 6.5 0 13z" fill="#34d399"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .title { fill: #f8fafc; font-size: 34px; font-weight: 950; letter-spacing: -0.02em; }
      .subtitle { fill: #cbd5e1; font-size: 14px; font-weight: 700; }
      .eyebrow { fill: #7dd3fc; font-size: 11px; font-weight: 950; letter-spacing: 0.18em; }
      .cardTitle { fill: #ffffff; font-size: 18px; font-weight: 950; }
      .label { fill: #e2e8f0; font-size: 13px; font-weight: 850; }
      .text { fill: #cbd5e1; font-size: 12px; font-weight: 700; }
      .muted { fill: #94a3b8; font-size: 11px; font-weight: 700; }
      .tiny { fill: #94a3b8; font-size: 10px; font-weight: 800; }
      .code { fill: #dbeafe; font-size: 12px; font-weight: 850; }
      .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.25; }
      .blue { fill: rgba(29, 78, 216, 0.25); stroke: #60a5fa; stroke-width: 1.4; }
      .green { fill: rgba(4, 120, 87, 0.70); stroke: #34d399; stroke-width: 1.35; }
      .purple { fill: rgba(67, 56, 202, 0.45); stroke: #a78bfa; stroke-width: 1.35; }
      .amber { fill: rgba(120, 53, 15, 0.56); stroke: #fbbf24; stroke-width: 1.25; }
      .chip { fill: #10243a; stroke: #334155; stroke-width: 1.1; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect width="1280" height="760" fill="url(#grid)" opacity="0.9"/>
  <circle cx="1088" cy="170" r="190" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.16"/>
  <circle cx="1050" cy="610" r="145" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.18"/>

  <g class="font">
    <text x="58" y="62" class="title">Human and Agent Access Model</text>
    <text x="58" y="92" class="subtitle">One versioned contract for dashboards, coding agents, CI, MCP tools, and reviewer workflows.</text>

    <g transform="translate(58 142)" filter="url(#shadow)">
      <rect width="246" height="310" rx="20" class="panel"/>
      <text x="24" y="38" class="eyebrow">CALLERS</text>
      <g transform="translate(24 66)">
        <rect width="198" height="46" rx="12" class="blue"/>
        <text x="16" y="28" class="label">Human console</text>
      </g>
      <g transform="translate(24 124)">
        <rect width="198" height="46" rx="12" class="purple"/>
        <text x="16" y="28" class="label">Agent skills</text>
      </g>
      <g transform="translate(24 182)">
        <rect width="198" height="46" rx="12" class="blue"/>
        <text x="16" y="28" class="label">CI / release gates</text>
      </g>
      <g transform="translate(24 240)">
        <rect width="198" height="46" rx="12" class="purple"/>
        <text x="16" y="28" class="label">MCP clients</text>
      </g>
    </g>

    <path d="M315 296h72" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrow)"/>

    <g transform="translate(394 130)" filter="url(#shadow)">
      <rect width="286" height="334" rx="22" fill="url(#blue)" stroke="#60a5fa" stroke-width="1.7"/>
      <text x="26" y="42" class="cardTitle">Versioned API boundary</text>
      <text x="26" y="66" class="text">Every caller receives the same envelope.</text>
      <g transform="translate(26 94)">
        <rect width="232" height="40" rx="10" class="chip"/>
        <text x="18" y="25" class="code">GET /api/v1/posture/current</text>
      </g>
      <g transform="translate(26 146)">
        <rect width="232" height="40" rx="10" class="chip"/>
        <text x="18" y="25" class="code">GET /api/v1/control-tests</text>
      </g>
      <g transform="translate(26 198)">
        <rect width="232" height="40" rx="10" class="chip"/>
        <text x="18" y="25" class="code">GET /api/v1/violations</text>
      </g>
      <g transform="translate(26 250)">
        <rect width="232" height="40" rx="10" class="chip"/>
        <text x="18" y="25" class="code">POST /api/v1/snapshots</text>
      </g>
      <text x="26" y="316" class="muted">response: data + meta + errors</text>
    </g>

    <path d="M692 296h70" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrow)"/>

    <g transform="translate(774 130)" filter="url(#shadow)">
      <rect width="330" height="334" rx="22" class="green"/>
      <text x="26" y="42" class="cardTitle">Trust boundary</text>
      <text x="26" y="66" class="text">Identity, tenancy, role, and audit are enforced before action.</text>
      <g transform="translate(26 96)">
        <rect width="132" height="48" rx="12" fill="#064e3b" stroke="#34d399"/>
        <text x="16" y="23" class="label">API keys</text>
        <text x="16" y="38" class="tiny">agents + CI</text>
        <rect x="152" width="132" height="48" rx="12" fill="#064e3b" stroke="#34d399"/>
        <text x="168" y="23" class="label">OIDC / SAML</text>
        <text x="168" y="38" class="tiny">humans</text>
      </g>
      <g transform="translate(26 162)">
        <rect width="284" height="42" rx="11" fill="#052e2b" stroke="#2dd4bf"/>
        <text x="18" y="26" class="label">RBAC: role-scoped actions</text>
      </g>
      <g transform="translate(26 218)">
        <rect width="284" height="42" rx="11" fill="#052e2b" stroke="#2dd4bf"/>
        <text x="18" y="26" class="label">Audit: actor, route, decision ID</text>
      </g>
      <g transform="translate(26 274)">
        <rect width="284" height="42" rx="11" fill="#052e2b" stroke="#2dd4bf"/>
        <text x="18" y="26" class="label">Redaction: owners, notes, secrets</text>
      </g>
    </g>

    <path d="M938 476v58" stroke="#34d399" stroke-width="3.5" marker-end="url(#arrowGreen)"/>

    <g transform="translate(58 548)" filter="url(#shadow)">
      <rect width="1100" height="122" rx="22" class="panel"/>
      <text x="26" y="42" class="eyebrow">COMPOSABLE SKILL CHAIN</text>
      <g transform="translate(26 62)">
        <rect width="166" height="44" rx="12" class="purple"/>
        <text x="18" y="27" class="label">ingest evidence</text>
        <path d="M178 22h42" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
        <rect x="228" width="166" height="44" rx="12" class="blue"/>
        <text x="246" y="27" class="label">validate + normalize</text>
        <path d="M406 22h42" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
        <rect x="456" width="166" height="44" rx="12" class="green"/>
        <text x="474" y="27" class="label">evaluate controls</text>
        <path d="M634 22h42" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
        <rect x="684" width="166" height="44" rx="12" class="amber"/>
        <text x="702" y="27" class="label">route remediation</text>
        <path d="M862 22h42" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
        <rect x="912" width="158" height="44" rx="12" class="blue"/>
        <text x="930" y="27" class="label">snapshot proof</text>
      </g>
    </g>
  </g>
</svg>
