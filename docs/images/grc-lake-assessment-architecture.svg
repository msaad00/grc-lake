    <text x="776" y="200" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="800">GRC Lake core</text>
    <text x="776" y="222" fill="#93c5fd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Deterministic product</text>

